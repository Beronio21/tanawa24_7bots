<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>probe office</title></head>
  <body>
    <div class="app-shell">
      <aside class="sidebar"><div id="sidebar-nav"></div></aside>
      <div class="workspace">
        <header class="topbar" id="top-status-bar"></header>
        <main class="page-view" id="page-view"></main>
      </div>
    </div>
    <script type="module">
      import "/styles/sunlit-theme.css";
      import { mount } from "/pages/VirtualOfficePage.js";
      mount(document.querySelector("#page-view"));
      setTimeout(() => { try { document.querySelector('[data-office-view="iso"]').click(); } catch (err) { document.title='ERR:'+err.message; const e=document.createElement('div'); e.style.cssText='position:fixed;z-index:99;top:0;left:0;background:#900;color:#fff;font:14px monospace;padding:6px'; e.textContent='ERR '+err.message; document.body.appendChild(e); return; } const host=document.querySelector('[data-office-engine]'); const dbg=document.createElement('div'); dbg.style.cssText='position:fixed;z-index:99;top:0;left:0;background:#000;color:#fff;font:14px monospace;padding:6px'; dbg.textContent='view='+host.dataset.view+' tiles='+document.querySelectorAll('.office-cam').length+' vis='+[...document.querySelectorAll('.office-cam')].filter(t=>t.offsetParent!==null).length; document.body.appendChild(dbg); }, 900);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Character — Multi-Age & Gender FK Perspective Rig</title>
  <style>
    :root {
      --ink: #1e1829;
      --ink-soft: #4b3f61;
      --skin-base: #fff0e6;
      --skin-shade: #edd0c0;
      --skin-blush: #fb7185;
      --hair-base: #2a3142;
      --hair-shade: #181c26;
      --hair-shine: #7c89ab;
      --eye-ring: #172554;
      --eye-top: #1d4ed8;
      --eye-mid: #3b82f6;
      --eye-glow: #93c5fd;
      --outfit-main: #1d4ed8;
      --outfit-shade: #172554;
      --outfit-light: #3b82f6;
      --shirt-base: #ffffff;
      --shirt-shade: #e2e8f0;
      --ribbon-accent: #e11d48;
      --gold: #eab308;
      --string-glow: #38bdf8;

      --depth: 1;
      --paper-opacity: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #100e18;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hud-top {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 16, 28, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 10.5px;
      z-index: 30;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transition: 0.25s;
    }

    .dot.paper {
      background: #fb7185;
      box-shadow: 0 0 10px #fb7185;
    }

    .state-text {
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .state-text.paper {
      color: #fb7185;
    }

    .hud-bottom {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 30;
      max-width: 99vw;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .btn {
      background: rgba(20, 18, 32, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f1f5f9;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .btn.active-blue {
      border-color: #38bdf8;
      background: #0c4a6e;
      color: #e0f2fe;
    }

    .btn.active-amber {
      border-color: #fbbf24;
      background: #78350f;
      color: #fef3c7;
    }

    .btn.active-emerald {
      border-color: #34d399;
      background: #064e3b;
      color: #d1fae5;
    }

    .btn.active-violet {
      border-color: #c084fc;
      background: #4c1d95;
      color: #f3e8ff;
    }

    .btn.active-cyan {
      border-color: #22d3ee;
      background: #164e63;
      color: #cffafe;
    }

    .btn.active-rose {
      border-color: #fb7185;
      background: #881337;
      color: #ffe4e6;
    }

    .btn.active-teal {
      border-color: #2dd4bf;
      background: #115e59;
      color: #ccfbf1;
    }

    .btn.primary {
      border-color: #fb7185;
      background: #4c0519;
      color: #ffe4e6;
    }

    .btn.primary.active {
      background: #e11d48;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(225, 29, 72, 0.55);
    }

    .control-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 18, 32, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .persp-slider {
      width: 88px;
      accent-color: #fbbf24;
      cursor: pointer;
      height: 12px;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: 0.15s;
    }

    .swatch:hover {
      transform: scale(1.18);
    }

    .swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      transform: scale(1.18);
    }

    kbd {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 8.5px;
      font-family: inherit;
    }

    #viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      perspective: 1350px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }

    #viewport:active {
      cursor: grabbing;
    }

    body.pixel-mode #viewport {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body.pixel-mode .character-rig {
      filter:
        url(#pixelFilter)
        drop-shadow(2px 0 0 #120e1c)
        drop-shadow(-2px 0 0 #120e1c)
        drop-shadow(0 2px 0 #120e1c)
        drop-shadow(0 -2px 0 #120e1c)
        drop-shadow(2px 0 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(-2px 0 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(0 2px 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(0 -2px 0 rgba(255, 255, 255, var(--paper-opacity)));
    }

    .camera-rig {
      transform-style: preserve-3d;
      position: relative;
      width: 0;
      height: 0;
    }

    .character-rig {
      position: absolute;
      width: 440px;
      height: 820px;
      left: -220px;
      top: -495px;
      transform-style: preserve-3d;
      filter:
        drop-shadow(2.2px 0 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(-2.2px 0 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(0 2.2px 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(0 -2.2px 0 rgba(255, 255, 255, var(--paper-opacity)))
        drop-shadow(0 0 calc(12px * var(--paper-opacity)) var(--string-glow));
    }

    .art-plane {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transform: translateZ(calc(var(--z, 0px) * var(--depth) + var(--micro, 0px) * (1 - var(--depth))));
      filter: drop-shadow(0 calc(3px * var(--depth)) calc(4px * var(--depth)) rgba(0, 0, 0, calc(0.24 * var(--depth))));
    }

    .art-plane svg,
    .paper-back-plane svg,
    .cage-plane svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .ink {
      stroke: var(--ink);
      stroke-width: 1.55px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .ink-fine {
      stroke: var(--ink);
      stroke-width: 1.05px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .ink-delicate {
      stroke: var(--ink-soft);
      stroke-width: 0.78px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .paper-back-plane {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      transform: translateZ(-0.4px) rotateY(180deg);
      opacity: var(--paper-opacity);
      pointer-events: none;
    }

    .cage-plane {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform: translateZ(34px);
      display: none;
    }

    body.show-cage .cage-plane {
      display: block;
    }

    .joint-debug {
      display: none;
      pointer-events: none;
    }

    body.show-joints .joint-debug {
      display: inline;
    }

    .string-wave {
      position: absolute;
      left: 118px;
      right: 118px;
      top: 42px;
      bottom: 64px;
      transform: translateZ(28px);
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 7px,
        rgba(56, 189, 248, 0.65) 8px,
        rgba(251, 113, 133, 0.65) 9px
      );
      border: 2px solid var(--string-glow);
      box-shadow: 0 0 24px var(--string-glow);
      border-radius: 16px;
    }

    .string-wave.flash {
      animation: stringFlash 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stringFlash {
      0% { opacity: 1; transform: translateZ(28px) scale(1.12, 0.12); }
      45% { opacity: 0.9; transform: translateZ(28px) scale(1.03, 1.02); }
      100% { opacity: 0; transform: translateZ(28px) scale(1, 1); }
    }
  </style>
</head>
<body>

  <!-- TOP STATUS PILL -->
  <div class="hud-top">
    <span class="dot" id="statusDot"></span>
    <span class="state-text" id="stateLabel">3D MATERIALIZED</span>
    <span style="color:#64748b;">|</span>
    <span style="color:#fda4af; font-weight:800;" id="charReadout">♀ FEMALE · TEENAGER</span>
    <span style="color:#64748b;">|</span>
    <span style="color:#fef08a; font-weight:800;" id="angleReadout">3/4 VIEW (RIGHT)</span>
    <span style="color:#64748b;">|</span>
    <span style="color:#f5d0fe; font-weight:800;" id="limbReadout">ARMS: ON HIP · LEGS: WIDE A-STANCE</span>
    <span style="color:#64748b;">|</span>
    <span style="color:#86efac; font-weight:800;" id="gazeReadout">GAZE: RIGHT ▶</span>
    <span style="color:#64748b;">|</span>
    <span style="color:#93c5fd; font-weight:800;" id="exprReadout">1. POUT</span>
  </div>

  <!-- CHARACTER VIEWPORT -->
  <div id="viewport">
    <div class="camera-rig" id="cameraRig">
      <div class="character-rig" id="charRig">
        <div class="string-wave" id="stringWave"></div>

        <!-- SHARED GRADIENTS, HATCH PATTERN & PIXEL FILTER -->
        <svg width="0" height="0" style="position:absolute;">
          <defs id="sharedDefs">
            <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="var(--eye-top)" />
              <stop offset="52%" stop-color="var(--eye-mid)" />
              <stop offset="86%" stop-color="var(--eye-glow)" />
              <stop offset="100%" stop-color="#ffffff" />
            </linearGradient>
            <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="var(--outfit-shade)" />
              <stop offset="26%" stop-color="var(--outfit-main)" />
              <stop offset="50%" stop-color="var(--outfit-light)" />
              <stop offset="74%" stop-color="var(--outfit-main)" />
              <stop offset="100%" stop-color="var(--outfit-shade)" />
            </linearGradient>
            <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="var(--hair-shade)" />
              <stop offset="32%" stop-color="var(--hair-base)" />
              <stop offset="85%" stop-color="var(--hair-base)" />
              <stop offset="100%" stop-color="var(--hair-shade)" />
            </linearGradient>

            <pattern id="skirtHatch" width="5" height="5" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
              <rect width="5" height="5" fill="#181524" />
              <line x1="0" y1="0" x2="0" y2="5" stroke="#09070f" stroke-width="2.1" />
            </pattern>

            <filter id="pixelFilter" x="-5%" y="-5%" width="110%" height="110%">
              <feFlood id="pixelFlood" x="1" y="1" height="1.5" width="1.5" />
              <feComposite id="pixelComp" width="3" height="3" />
              <feTile result="a" />
              <feComposite in="SourceGraphic" in2="a" operator="in" />
              <feMorphology id="pixelMorph" operator="dilate" radius="1.15" />
            </filter>
          </defs>
        </svg>

        <!-- LAYER 1: BACK HAIR -->
        <div class="art-plane" style="--z:-20px; --micro:-0.12px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="backHairFront" style="display:none;"></g>
            <g id="backHair34"></g>
          </svg>
        </div>

        <!-- LAYER 2: ANALYTIC FK LEGS, FEET, HIP/GLUTE CONTOUR & SKIRT / TROUSERS -->
        <div class="art-plane" style="--z:-5px; --micro:-0.05px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="bodyLowerFront" style="display:none;">
              <g id="lowerBaseFront"></g>
              <g id="fkLegsFront"></g>
              <g id="lowerGarmentFront"></g>
            </g>

            <g id="bodyLower34">
              <g id="lowerBase34"></g>
              <g id="fkLegs34"></g>
              <g id="lowerGarment34"></g>
            </g>
          </svg>
        </div>

        <!-- LAYER 2B: FAR ARM OCCLUDED BEHIND TORSO IN 3/4 VIEWS -->
        <div class="art-plane" style="--z:-1px; --micro:-0.02px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="armsFar34">
              <g id="fkFarArm34"></g>
            </g>
          </svg>
        </div>

        <!-- LAYER 3: TORSO, COLLARS, JACKETS/CARDIGANS & CHEST/BUST ANATOMY -->
        <div class="art-plane" style="--z:2px; --micro:0px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="neckLayer"></g>
            <g id="torsoFront" style="display:none;"></g>
            <g id="torso34"></g>
          </svg>
        </div>

        <!-- LAYER 4: NEAR ANALYTIC FK ARMS, SLEEVES & HANDS -->
        <div class="art-plane" style="--z:8px; --micro:0.04px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="armsFront" style="display:none;">
              <g id="fkArmsFront"></g>
            </g>
            <g id="arms34">
              <g id="fkArms34"></g>
            </g>
          </svg>
        </div>

        <!-- LAYER 5: MULTI-TILT ANIME HEADS -->
        <div class="art-plane" style="--z:14px; --micro:0.08px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="headFront" style="display:none;"></g>
            <g id="head34Mid"></g>
            <g id="head34Up" style="display:none;"></g>
            <g id="head34Down" style="display:none;"></g>
          </svg>
        </div>

        <!-- LAYER 6: FRONT HAIR BANGS & JOINT DEBUG OVERLAY -->
        <div class="art-plane" style="--z:20px; --micro:0.12px;">
          <svg viewBox="0 0 440 820" class="proj-svg">
            <g id="frontHairFront" style="display:none;"></g>
            <g id="frontHair34"></g>
            <g id="jointDebugLayer" class="joint-debug"></g>
          </svg>
        </div>

        <!-- LAYER 7: 2D PAPER CARDSTOCK REVERSE BACK VIEW -->
        <div class="paper-back-plane">
          <svg viewBox="0 0 440 820" class="proj-svg" id="paperBackSvg"></svg>
        </div>

        <!-- LAYER 8: PERSPECTIVE CAGE WIREFRAME (G) -->
        <div class="cage-plane">
          <svg viewBox="0 0 440 820">
            <rect x="115" y="45" width="210" height="715" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" stroke-dasharray="6 4" rx="12" />
            <line x1="220" y1="35" x2="220" y2="770" stroke="rgba(251, 191, 36, 0.45)" stroke-width="1.1" stroke-dasharray="4 4" />
            <line x1="100" y1="205" x2="340" y2="205" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" stroke-dasharray="4 3" />
            <line x1="100" y1="426" x2="340" y2="426" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" stroke-dasharray="4 3" />
            <line x1="100" y1="562" x2="340" y2="562" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" stroke-dasharray="3 3" />
            <line x1="100" y1="706" x2="340" y2="706" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" stroke-dasharray="4 3" />
            <text x="122" y="62" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">VANISHING CAGE [G]</text>
            <text x="122" y="201" fill="#c084fc" font-size="9" font-family="monospace">SHOULDER AXIS</text>
            <text x="122" y="422" fill="#34d399" font-size="9" font-family="monospace">PELVIS / HIP AXIS</text>
            <text x="122" y="702" fill="#38bdf8" font-size="9" font-family="monospace">GROUND PLANE</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="hud-bottom">
    <!-- ROW 0: CHARACTER GENDER & AGE SELECTORS -->
    <div class="btn-row">
      <div class="control-pill">
        <span style="color:#fda4af; font-weight:800;">GENDER <kbd>M</kbd>:</span>
        <button class="btn gender-btn active-rose" data-gender="female" onclick="setGender('female')">♀ Female</button>
        <button class="btn gender-btn" data-gender="male" onclick="setGender('male')">♂ Male</button>
      </div>
      <div class="control-pill">
        <span style="color:#2dd4bf; font-weight:800;">AGE <kbd>N</kbd>:</span>
        <button class="btn age-btn active-teal" data-age="teenager" onclick="setAge('teenager')">Teenager</button>
        <button class="btn age-btn" data-age="adult" onclick="setAge('adult')">Adult</button>
        <button class="btn age-btn" data-age="old" onclick="setAge('old')">Old</button>
      </div>
    </div>

    <!-- ROW 1: CAMERA ANGLES -->
    <div class="btn-row">
      <button class="btn angle-btn" data-angle="34_l_up" onclick="selectAngle('34_l_up')">↖ 3/4 L Up</button>
      <button class="btn angle-btn" data-angle="34_l" onclick="selectAngle('34_l')">◀ 3/4 L</button>
      <button class="btn angle-btn" data-angle="34_l_down" onclick="selectAngle('34_l_down')">↙ 3/4 L Down</button>
      <button class="btn angle-btn" data-angle="front" onclick="selectAngle('front')">Front</button>
      <button class="btn angle-btn" data-angle="34_r_up" onclick="selectAngle('34_r_up')">3/4 R Up ↗</button>
      <button class="btn angle-btn active-amber" data-angle="34_r" onclick="selectAngle('34_r')">3/4 R ▶</button>
      <button class="btn angle-btn" data-angle="34_r_down" onclick="selectAngle('34_r_down')">3/4 R Down ↘</button>
      <button class="btn angle-btn" data-angle="back_180" onclick="selectAngle('back_180')">Back 180°</button>
    </div>

    <!-- ROW 2: FK LIMB POSES -->
    <div class="btn-row">
      <button class="btn active-violet" id="btnArmL" onclick="cycleArmL()">L Arm: On Hip</button>
      <button class="btn active-violet" id="btnArmR" onclick="cycleArmR()">R Arm: On Hip</button>
      <button class="btn active-violet" id="btnHands" onclick="cycleHandGesture()">Hands: Peace ✌️ <kbd>A</kbd></button>
      <button class="btn active-violet" id="btnLegs" onclick="cycleLegPose()">Legs: Wide A-Stance <kbd>L</kbd></button>
      <button class="btn" onclick="applyPresetPose('idol')">✨ Idol Peace</button>
      <button class="btn" onclick="applyPresetPose('tsundere')">💢 Confident Hip</button>
      <button class="btn" onclick="applyPresetPose('action')">⚡ Action Step</button>
      <button class="btn" onclick="applyPresetPose('shy')">🌸 Gentle</button>
    </div>

    <!-- ROW 3: PERSPECTIVE & DEBUG -->
    <div class="btn-row">
      <div class="control-pill">
        <span style="color:#fbbf24; font-weight:800;">PERSP:</span>
        <input type="range" id="perspSlider" class="persp-slider" min="-0.65" max="0.65" step="0.01" value="0" oninput="onPerspSlider(this.value)" />
        <span id="perspValue" style="color:#cbd5e1; font-family:monospace; min-width:34px; text-align:right;">0.00</span>
      </div>
      <button class="btn" id="btnCage" onclick="togglePerspectiveCage()">Perspective Cage: OFF <kbd>G</kbd></button>
      <button class="btn" id="btnPixelMode" onclick="togglePixelMode()">Pixel Rasterizer: OFF <kbd>P</kbd></button>
      <button class="btn" id="btnPixelBlock" onclick="cyclePixelBlock()">Block: 3px</button>
      <button class="btn" id="btnJointDebug" onclick="toggleJointDebug()">Joint Lock Debug: OFF <kbd>X</kbd></button>
    </div>

    <!-- ROW 4: GAZE & EXPRESSIONS -->
    <div class="btn-row">
      <button class="btn gaze-btn" data-gaze="left" onclick="setGazePreset('left')">👁 Left</button>
      <button class="btn gaze-btn" data-gaze="center" onclick="setGazePreset('center')">👁 Center</button>
      <button class="btn gaze-btn active-emerald" data-gaze="right" onclick="setGazePreset('right')">👁 Right</button>
      <button class="btn gaze-btn" data-gaze="up" onclick="setGazePreset('up')">👁 Up</button>
      <button class="btn" id="btnFollowMouse" onclick="toggleFollowMouse()">Cursor: OFF</button>
      <button class="btn expr-btn active-blue" data-idx="0" onclick="setExpression(0)">1. Pout</button>
      <button class="btn expr-btn" data-idx="1" onclick="setExpression(1)">2. Grin</button>
      <button class="btn expr-btn" data-idx="2" onclick="setExpression(2)">3. Serious</button>
      <button class="btn expr-btn" data-idx="3" onclick="setExpression(3)">4. Shout</button>
      <button class="btn expr-btn" data-idx="4" onclick="setExpression(4)">5. Wink</button>
      <button class="btn expr-btn" data-idx="5" onclick="setExpression(5)">6. Shy Glance</button>
    </div>

    <!-- ROW 5: PALETTE, ACCESSORIES & 3D/2D -->
    <div class="btn-row">

    let currentPersp = 0.0;

    function getScaleAtY(y, p) {
      const y0 = 285;
      const H = 450;
      const t = (y - y0) / H;
      const denom = Math.max(0.30, Math.min(2.25, 1 - p * t));
      return 1 / denom;
    }

    function projectPoint(x, y, p) {
      if (Math.abs(p) < 0.001) return [x, y];
      const y0 = 285;
      const H = 450;
      const t = (y - y0) / H;
      const denom = Math.max(0.30, Math.min(2.25, 1 - p * t));
      const sx = 1 / denom;
      const yShift = p > 0 ? -54 * (p / 0.44) : 14 * (-p / 0.52);
      const ny = y0 + H * (-Math.log(denom) / p) + yShift;
      const nx = 220 + (x - 220) * sx;
      return [nx, ny];
    }

    function warpSvgPathD(origD, p) {
      if (Math.abs(p) < 0.001) return origD;
      return origD.replace(/([MLCQZ])\s*([^MLCQZ]*)/gi, (_, cmd, argsStr) => {
        const upper = cmd.toUpperCase();
        if (upper === "Z") return "Z ";
        const nums = argsStr.trim().split(/[\s,]+/).filter(Boolean).map(Number);
        const out = [];
        for (let i = 0; i < nums.length; i += 2) {
          const [px, py] = projectPoint(nums[i], nums[i + 1], p);
          out.push(px.toFixed(1), py.toFixed(1));
        }
        return `${upper} ${out.join(" ")} `;
      }).trim();
    }

    function fkStep(x, y, deg, len) {
      const rad = (deg * Math.PI) / 180;
      return {
        x: x + Math.sin(rad) * len,
        y: y + Math.cos(rad) * len
      };
    }

    function taperedBonePath(p1, p2, r1, r2, capStart = true) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const nx = -uy;
      const ny = ux;

      const a1 = { x: p1.x + nx * r1, y: p1.y + ny * r1 };
      const a2 = { x: p2.x + nx * r2, y: p2.y + ny * r2 };
      const b2 = { x: p2.x - nx * r2, y: p2.y - ny * r2 };
      const b1 = { x: p1.x - nx * r1, y: p1.y - ny * r1 };

      const c2a = { x: a2.x + ux * r2 * 1.15, y: a2.y + uy * r2 * 1.15 };
      const c2b = { x: b2.x + ux * r2 * 1.15, y: b2.y + uy * r2 * 1.15 };

      if (!capStart) {
        return `M ${a1.x.toFixed(1)} ${a1.y.toFixed(1)} ` +
               `L ${a2.x.toFixed(1)} ${a2.y.toFixed(1)} ` +
               `C ${c2a.x.toFixed(1)} ${c2a.y.toFixed(1)}, ${c2b.x.toFixed(1)} ${c2b.y.toFixed(1)}, ${b2.x.toFixed(1)} ${b2.y.toFixed(1)} ` +
               `L ${b1.x.toFixed(1)} ${b1.y.toFixed(1)} Z`;
      }

      const c1b = { x: b1.x - ux * r1 * 1.15, y: b1.y - uy * r1 * 1.15 };
      const c1a = { x: a1.x - ux * r1 * 1.15, y: a1.y - uy * r1 * 1.15 };

      return `M ${a1.x.toFixed(1)} ${a1.y.toFixed(1)} ` +
             `L ${a2.x.toFixed(1)} ${a2.y.toFixed(1)} ` +
             `C ${c2a.x.toFixed(1)} ${c2a.y.toFixed(1)}, ${c2b.x.toFixed(1)} ${c2b.y.toFixed(1)}, ${b2.x.toFixed(1)} ${b2.y.toFixed(1)} ` +
             `L ${b1.x.toFixed(1)} ${b1.y.toFixed(1)} ` +
             `C ${c1b.x.toFixed(1)} ${c1b.y.toFixed(1)}, ${c1a.x.toFixed(1)} ${c1a.y.toFixed(1)}, ${a1.x.toFixed(1)} ${a1.y.toFixed(1)} Z`;
    }

    function appendHandAtWrist(group, wristPt, totalAngleDeg, gestureId, sideSign) {

        group.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(ptrD, currentPersp), fill: "var(--skin-base)" }));
      } else if (gestureId === "fist") {
        const fistD = `M ${toWorld(0, -5.8).x.toFixed(1)} ${toWorld(0, -5.8).y.toFixed(1)} L ${toWorld(14, -6.6).x.toFixed(1)} ${toWorld(14, -6.6).y.toFixed(1)} L ${toWorld(15, 6.6).x.toFixed(1)} ${toWorld(15, 6.6).y.toFixed(1)} L ${toWorld(0, 5.8).x.toFixed(1)} ${toWorld(0, 5.8).y.toFixed(1)} Z`;
        group.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(fistD, currentPersp), fill: "var(--skin-base)" }));
      } else if (gestureId === "wave") {
        const waveD = `M ${toWorld(0, -5.8).x.toFixed(1)} ${toWorld(0, -5.8).y.toFixed(1)} L ${toWorld(21, -10.5).x.toFixed(1)} ${toWorld(21, -10.5).y.toFixed(1)} L ${toWorld(14, -4.4).x.toFixed(1)} ${toWorld(14, -4.4).y.toFixed(1)} L ${toWorld(24, -3.2).x.toFixed(1)} ${toWorld(24, -3.2).y.toFixed(1)} L ${toWorld(14, 1.0).x.toFixed(1)} ${toWorld(14, 1.0).y.toFixed(1)} L ${toWorld(23, 4.8).x.toFixed(1)} ${toWorld(23, 4.8).y.toFixed(1)} L ${toWorld(13, 5.4).x.toFixed(1)} ${toWorld(13, 5.4).y.toFixed(1)} L ${toWorld(19, 9.6).x.toFixed(1)} ${toWorld(19, 9.6).y.toFixed(1)} L ${toWorld(0, 5.8).x.toFixed(1)} ${toWorld(0, 5.8).y.toFixed(1)} Z`;
        group.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(waveD, currentPersp), fill: "var(--skin-base)" }));
      } else {
        const relD = `M ${toWorld(0, -5.5).x.toFixed(1)} ${toWorld(0, -5.5).y.toFixed(1)} L ${toWorld(23, -4.2).x.toFixed(1)} ${toWorld(23, -4.2).y.toFixed(1)} L ${toWorld(22, 5.8).x.toFixed(1)} ${toWorld(22, 5.8).y.toFixed(1)} L ${toWorld(0, 5.8).x.toFixed(1)} ${toWorld(0, 5.8).y.toFixed(1)} Z`;
        group.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(relD, currentPersp), fill: "var(--skin-base)" }));
      }

      const [jwx, jwy] = projectPoint(w.x, w.y, currentPersp);
      group.appendChild(createEl("circle", { cx: jwx.toFixed(1), cy: jwy.toFixed(1), r: (5.8 * hs * getScaleAtY(w.y, currentPersp)).toFixed(2), fill: "var(--skin-base)" }));
    }

    function buildArmChain(container, shoulderPt, shDeg, elDeg, wrDeg, gestureId, sideSign, isFarArm = false) {
      const m = getCharacterMetrics();
      const elbowPt = fkStep(shoulderPt.x, shoulderPt.y, shDeg, m.upperLen);
      const wristPt = fkStep(elbowPt.x, elbowPt.y, shDeg + elDeg, m.foreLen);
      const tipPt = fkStep(wristPt.x, wristPt.y, shDeg + elDeg + wrDeg, 18);

      const hasLongSleeves = (charAge === "adult" || charAge === "old");
      const sleeveFill = (charAge === "adult") ? "var(--outfit-main)" :
                         (charAge === "old") ? "var(--outfit-light)" : "var(--shirt-base)";
      const sleeveShade = (charAge === "adult") ? "var(--outfit-shade)" :
                          (charAge === "old") ? "var(--outfit-main)" : "var(--shirt-shade)";

      const upperD = taperedBonePath(shoulderPt, elbowPt, isFarArm ? m.armR[1] : m.armR[0], m.armR[1], false);
      const forearmD = taperedBonePath(elbowPt, wristPt, m.armR[1], m.armR[2]);

      container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(upperD, currentPersp), fill: "var(--skin-base)" }));
      container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(forearmD, currentPersp), fill: "var(--skin-base)" }));

      if (hasLongSleeves) {
        const upSleeveD = taperedBonePath(shoulderPt, elbowPt, isFarArm ? m.sleeveR[1] * 0.96 : m.sleeveR[0], m.sleeveR[1] * 0.9, true);
        const cuffPt = fkStep(elbowPt.x, elbowPt.y, shDeg + elDeg, m.foreLen * 0.88);
        const foreSleeveD = taperedBonePath(elbowPt, cuffPt, m.sleeveR[1] * 0.88, m.armR[2] + 2.3);
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(upSleeveD, currentPersp), fill: sleeveFill }));
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(foreSleeveD, currentPersp), fill: sleeveFill }));
        if (isFarArm) {
          container.appendChild(createEl("path", { d: warpSvgPathD(upSleeveD, currentPersp), fill: sleeveShade, opacity: "0.28" }));
          container.appendChild(createEl("path", { d: warpSvgPathD(foreSleeveD, currentPersp), fill: sleeveShade, opacity: "0.28" }));
        }
        const [jex, jey] = projectPoint(elbowPt.x, elbowPt.y, currentPersp);
        container.appendChild(createEl("circle", { cx: jex.toFixed(1), cy: jey.toFixed(1), r: (m.sleeveR[1] * 0.86 * getScaleAtY(elbowPt.y, currentPersp)).toFixed(2), fill: sleeveFill }));
      } else {
        const sleeveEnd = fkStep(shoulderPt.x, shoulderPt.y, shDeg, 36);
        const sleeveD = taperedBonePath(shoulderPt, sleeveEnd, isFarArm ? m.sleeveR[1] * 0.92 : m.sleeveR[0], m.sleeveR[1], true);
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(sleeveD, currentPersp), fill: "var(--shirt-base)" }));
        if (isFarArm) {
          container.appendChild(createEl("path", { d: warpSvgPathD(sleeveD, currentPersp), fill: "var(--shirt-shade)", opacity: "0.35" }));
        }
        const [jex, jey] = projectPoint(elbowPt.x, elbowPt.y, currentPersp);
        container.appendChild(createEl("circle", { cx: jex.toFixed(1), cy: jey.toFixed(1), r: (m.armR[1] * 0.96 * getScaleAtY(elbowPt.y, currentPersp)).toFixed(2), fill: "var(--skin-base)" }));
      }

      appendHandAtWrist(container, wristPt, shDeg + elDeg + wrDeg, gestureId, sideSign);
      return [shoulderPt, elbowPt, wristPt, tipPt];
    }

    function buildFootAtAnkle(container, anklePt, legAngleDeg, ankleDeg, viewMode, sideSign) {
      const fs = charGender === "male" ? 1.15 : 1.0;
      const tiltDeg = (legAngleDeg + ankleDeg) * 0.35 + (viewMode === "34" ? (sideSign === 1 ? 6 : 2) : 0);
      const rad = (tiltDeg * Math.PI) / 180;
      const fx = Math.cos(rad);
      const fy = Math.sin(rad);
      const ux = -Math.sin(rad);
      const uy = Math.cos(rad);

      const pt = (fwd, down) => ({
        x: anklePt.x + fx * fwd * fs + ux * down * fs,
        y: anklePt.y + fy * fwd * fs + uy * down * fs
      });

      const useShoes = showShoes || charGender === "male";

      if (viewMode === "34") {
        const bAnkle = pt(-7.0, -3.0);
        const fAnkle = pt(7.0, -3.0);
        const heelPt = pt(-6.2, 31.5);
        const toeBot = pt(35.0, 32.5);
        const instepMid = pt(21.0, 17.0);

        const footD =
          `M ${bAnkle.x.toFixed(1)} ${bAnkle.y.toFixed(1)} ` +
          `C ${pt(-9.2, 11.5).x.toFixed(1)} ${pt(-9.2, 11.5).y.toFixed(1)}, ${pt(-10.2, 24.5).x.toFixed(1)} ${pt(-10.2, 24.5).y.toFixed(1)}, ${heelPt.x.toFixed(1)} ${heelPt.y.toFixed(1)} ` +
          `C ${pt(5.5, 35.5).x.toFixed(1)} ${pt(5.5, 35.5).y.toFixed(1)}, ${pt(25.0, 36.5).x.toFixed(1)} ${pt(25.0, 36.5).y.toFixed(1)}, ${toeBot.x.toFixed(1)} ${toeBot.y.toFixed(1)} ` +
          `C ${pt(38.5, 28.5).x.toFixed(1)} ${pt(38.5, 28.5).y.toFixed(1)}, ${pt(32.0, 21.5).x.toFixed(1)} ${pt(32.0, 21.5).y.toFixed(1)}, ${instepMid.x.toFixed(1)} ${instepMid.y.toFixed(1)} ` +
          `C ${pt(13.5, 13.0).x.toFixed(1)} ${pt(13.5, 13.0).y.toFixed(1)}, ${pt(8.5, 5.5).x.toFixed(1)} ${pt(8.5, 5.5).y.toFixed(1)}, ${fAnkle.x.toFixed(1)} ${fAnkle.y.toFixed(1)} Z`;

        if (useShoes) {
          const shoeToe = pt(38.0, 33.8);
          const shoeColor = charGender === "male" ? "#1e293b" : "#3b2314";
          const shoeD =
            `M ${pt(-7.8, 1.0).x.toFixed(1)} ${pt(-7.8, 1.0).y.toFixed(1)} ` +
            `C ${pt(-10.0, 13.5).x.toFixed(1)} ${pt(-10.0, 13.5).y.toFixed(1)}, ${pt(-10.8, 27.5).x.toFixed(1)} ${pt(-10.8, 27.5).y.toFixed(1)}, ${pt(-6.5, 34.8).x.toFixed(1)} ${pt(-6.5, 34.8).y.toFixed(1)} ` +
            `C ${pt(6.0, 38.2).x.toFixed(1)} ${pt(6.0, 38.2).y.toFixed(1)}, ${pt(26.5, 38.8).x.toFixed(1)} ${pt(26.5, 38.8).y.toFixed(1)}, ${shoeToe.x.toFixed(1)} ${shoeToe.y.toFixed(1)} ` +
            `C ${pt(40.5, 28.5).x.toFixed(1)} ${pt(40.5, 28.5).y.toFixed(1)}, ${pt(32.5, 19.8).x.toFixed(1)} ${pt(32.5, 19.8).y.toFixed(1)}, ${pt(20.5, 15.5).x.toFixed(1)} ${pt(20.5, 15.5).y.toFixed(1)} ` +
            `C ${pt(13.0, 12.0).x.toFixed(1)} ${pt(13.0, 12.0).y.toFixed(1)}, ${pt(9.0, 6.2).x.toFixed(1)} ${pt(9.0, 6.2).y.toFixed(1)}, ${pt(7.8, 1.0).x.toFixed(1)} ${pt(7.8, 1.0).y.toFixed(1)} Z`;
          const strapD = `M ${pt(14.0, 13.5).x.toFixed(1)} ${pt(14.0, 13.5).y.toFixed(1)} L ${pt(19.5, 25.0).x.toFixed(1)} ${pt(19.5, 25.0).y.toFixed(1)}`;
          container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(shoeD, currentPersp), fill: shoeColor }));
          container.appendChild(createEl("path", { class: "ink-fine", d: warpSvgPathD(strapD, currentPersp), fill: "none" }));
          return shoeToe;
        } else {
          const toeLineD = `M ${pt(26.5, 30.2).x.toFixed(1)} ${pt(26.5, 30.2).y.toFixed(1)} L ${pt(31.8, 32.0).x.toFixed(1)} ${pt(31.8, 32.0).y.toFixed(1)}`;
          container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(footD, currentPersp), fill: "var(--skin-base)" }));
          container.appendChild(createEl("path", { class: "ink-delicate", d: warpSvgPathD(toeLineD, currentPersp), fill: "none" }));
          const [jax, jay] = projectPoint(anklePt.x, anklePt.y, currentPersp);
          container.appendChild(createEl("circle", { cx: jax.toFixed(1), cy: jay.toFixed(1), r: (6.8 * fs * getScaleAtY(anklePt.y, currentPersp)).toFixed(2), fill: "var(--skin-base)" }));
          return toeBot;
        }
      } else {
        const s = sideSign;
        const ptf = (outward, down) => pt(outward * s, down);
        const inAnk = ptf(-6.8, -3.0);
        const outAnk = ptf(6.8, -3.0);
        const toeCenter = ptf(3.0, 38.0);

        const footFrontD =
          `M ${inAnk.x.toFixed(1)} ${inAnk.y.toFixed(1)} ` +
          `C ${ptf(-8.5, 12.5).x.toFixed(1)} ${ptf(-8.5, 12.5).y.toFixed(1)}, ${ptf(-9.6, 26.5).x.toFixed(1)} ${ptf(-9.6, 26.5).y.toFixed(1)}, ${ptf(-6.2, 35.5).x.toFixed(1)} ${ptf(-6.2, 35.5).y.toFixed(1)} ` +
          `C ${ptf(-0.8, 39.2).x.toFixed(1)} ${ptf(-0.8, 39.2).y.toFixed(1)}, ${ptf(9.2, 38.8).x.toFixed(1)} ${ptf(9.2, 38.8).y.toFixed(1)}, ${ptf(13.2, 33.2).x.toFixed(1)} ${ptf(13.2, 33.2).y.toFixed(1)} ` +
          `C ${ptf(14.0, 24.0).x.toFixed(1)} ${ptf(14.0, 24.0).y.toFixed(1)}, ${ptf(9.4, 12.0).x.toFixed(1)} ${ptf(9.4, 12.0).y.toFixed(1)}, ${outAnk.x.toFixed(1)} ${outAnk.y.toFixed(1)} Z`;

        if (useShoes) {
          const shoeColor = charGender === "male" ? "#1e293b" : "#3b2314";
          const shoeFrontD =
            `M ${ptf(-7.6, 1.0).x.toFixed(1)} ${ptf(-7.6, 1.0).y.toFixed(1)} ` +
            `C ${ptf(-9.5, 13.5).x.toFixed(1)} ${ptf(-9.5, 13.5).y.toFixed(1)}, ${ptf(-10.5, 28.0).x.toFixed(1)} ${ptf(-10.5, 28.0).y.toFixed(1)}, ${ptf(-6.6, 37.0).x.toFixed(1)} ${ptf(-6.6, 37.0).y.toFixed(1)} ` +
            `C ${ptf(0.0, 40.8).x.toFixed(1)} ${ptf(0.0, 40.8).y.toFixed(1)}, ${ptf(10.5, 40.2).x.toFixed(1)} ${ptf(10.5, 40.2).y.toFixed(1)}, ${ptf(14.5, 34.2).x.toFixed(1)} ${ptf(14.5, 34.2).y.toFixed(1)} ` +
            `C ${ptf(15.0, 24.8).x.toFixed(1)} ${ptf(15.0, 24.8).y.toFixed(1)}, ${ptf(10.2, 12.5).x.toFixed(1)} ${ptf(10.2, 12.5).y.toFixed(1)}, ${ptf(7.6, 1.0).x.toFixed(1)} ${ptf(7.6, 1.0).y.toFixed(1)} Z`;
          const strapFrontD = `M ${ptf(-7.6, 14.5).x.toFixed(1)} ${ptf(-7.6, 14.5).y.toFixed(1)} Q ${ptf(2.5, 17.5).x.toFixed(1)} ${ptf(2.5, 17.5).y.toFixed(1)} ${ptf(11.0, 14.5).x.toFixed(1)} ${ptf(11.0, 14.5).y.toFixed(1)}`;
          container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(shoeFrontD, currentPersp), fill: shoeColor }));
          container.appendChild(createEl("path", { class: "ink-fine", d: warpSvgPathD(strapFrontD, currentPersp), fill: "none" }));
          return toeCenter;
        } else {
          const toesD = `M ${ptf(-3.2, 33.8).x.toFixed(1)} ${ptf(-3.2, 33.8).y.toFixed(1)} L ${ptf(-3.6, 37.2).x.toFixed(1)} ${ptf(-3.6, 37.2).y.toFixed(1)} M ${ptf(1.8, 34.2).x.toFixed(1)} ${ptf(1.8, 34.2).y.toFixed(1)} L ${ptf(2.2, 37.8).x.toFixed(1)} ${ptf(2.2, 37.8).y.toFixed(1)} M ${ptf(6.8, 33.5).x.toFixed(1)} ${ptf(6.8, 33.5).y.toFixed(1)} L ${ptf(7.6, 36.8).x.toFixed(1)} ${ptf(7.6, 36.8).y.toFixed(1)}`;
          container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(footFrontD, currentPersp), fill: "var(--skin-base)" }));
          container.appendChild(createEl("path", { class: "ink-delicate", d: warpSvgPathD(toesD, currentPersp), fill: "none" }));
          const [jax, jay] = projectPoint(anklePt.x, anklePt.y, currentPersp);
          container.appendChild(createEl("circle", { cx: jax.toFixed(1), cy: jay.toFixed(1), r: (6.8 * fs * getScaleAtY(anklePt.y, currentPersp)).toFixed(2), fill: "var(--skin-base)" }));
          return toeCenter;
        }
      }
    }

    function buildLegChain(container, hipPt, hipDeg, kneeDeg, ankleDeg, sideSign, viewMode = "34") {
      const m = getCharacterMetrics();
      const kneePt = fkStep(hipPt.x, hipPt.y, hipDeg, m.thighLen);
      const anklePt = fkStep(kneePt.x, kneePt.y, hipDeg + kneeDeg, m.shinLen);

      if (charGender === "male") {
        const pantFill = charAge === "old" ? "#475569" : "var(--outfit-shade)";
        const thighPantD = taperedBonePath(hipPt, kneePt, m.legR[0] + 3.6, m.legR[1] + 3.2, false);
        const shinPantD = taperedBonePath(kneePt, anklePt, m.legR[1] + 3.2, m.legR[2] + 3.4);
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(thighPantD, currentPersp), fill: pantFill }));
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(shinPantD, currentPersp), fill: pantFill }));
        const [jkx, jky] = projectPoint(kneePt.x, kneePt.y, currentPersp);
        container.appendChild(createEl("circle", { cx: jkx.toFixed(1), cy: jky.toFixed(1), r: ((m.legR[1] + 3.0) * getScaleAtY(kneePt.y, currentPersp)).toFixed(2), fill: pantFill }));
        container.appendChild(createEl("path", { class: "ink-delicate", d: warpSvgPathD(`M ${kneePt.x - 6} ${kneePt.y} Q ${kneePt.x} ${kneePt.y + 4} ${kneePt.x + 6} ${kneePt.y}`, currentPersp), fill: "none" }));
      } else {
        const thighD = taperedBonePath(hipPt, kneePt, m.legR[0], m.legR[1]);
        const shinD = taperedBonePath(kneePt, anklePt, m.legR[1], m.legR[2]);

        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(thighD, currentPersp), fill: "var(--skin-base)" }));
        container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(shinD, currentPersp), fill: "var(--skin-base)" }));
        container.appendChild(createEl("path", { class: "ink-fine", d: warpSvgPathD(`M ${kneePt.x - 4.8} ${kneePt.y - 1.2} L ${kneePt.x + 4.8} ${kneePt.y - 1.2} L ${kneePt.x} ${kneePt.y + 5.2} Z`, currentPersp), fill: "none" }));

        if (showShoes) {
          const sockStart = fkStep(kneePt.x, kneePt.y, hipDeg + kneeDeg, m.shinLen * 0.58);
          const sockEnd = fkStep(kneePt.x, kneePt.y, hipDeg + kneeDeg, m.shinLen + 3);
          const sockD = taperedBonePath(sockStart, sockEnd, m.legR[1] * 0.82, m.legR[2] + 0.3);
          container.appendChild(createEl("path", { class: "ink", d: warpSvgPathD(sockD, currentPersp), fill: "#ffffff" }));
        }

        const [jkx, jky] = projectPoint(kneePt.x, kneePt.y, currentPersp);
        container.appendChild(createEl("circle", { cx: jkx.toFixed(1), cy: jky.toFixed(1), r: (m.legR[1] * 0.96 * getScaleAtY(kneePt.y, currentPersp)).toFixed(2), fill: "var(--skin-base)" }));
      }

      const toePt = buildFootAtAnkle(container, anklePt, hipDeg + kneeDeg, ankleDeg, viewMode, sideSign);
      return [hipPt, kneePt, anklePt, toePt];
    }

    function renderConnectedLimbs() {
      const m = getCharacterMetrics();
      const poseL = armPoses[armLIndex];
      const poseR = armPoses[armRIndex];
      const legP = legPoses[legPoseIndex];
      const gestureId = handGestures[handGestureIndex].id;

      const farArm34El = document.getElementById("fkFarArm34");
      const arms34El = document.getElementById("fkArms34");
      const armsFrontEl = document.getElementById("fkArmsFront");
      const legs34El = document.getElementById("fkLegs34");
      const legsFrontEl = document.getElementById("fkLegsFront");

      farArm34El.innerHTML = "";
      arms34El.innerHTML = "";
      armsFrontEl.innerHTML = "";
      legs34El.innerHTML = "";
      legsFrontEl.innerHTML = "";

      const c34 = [];
      c34.push(buildArmChain(farArm34El, m.sh34Far, poseR.shR, poseR.elR, poseR.wrR, gestureId, 1, true));
      c34.push(buildArmChain(arms34El, m.sh34Near, poseL.shL, poseL.elL, poseL.wrL, gestureId, -1, false));
      c34.push(buildLegChain(legs34El, m.hip34R, legP.hipR, legP.kneeR, legP.ankleR, 1, "34"));
      c34.push(buildLegChain(legs34El, m.hip34L, legP.hipL, legP.kneeL, legP.ankleL, -1, "34"));

      const cFront = [];
      cFront.push(buildArmChain(armsFrontEl, m.shFrontL, poseL.shL, poseL.elL, poseL.wrL, gestureId, -1, false));
      cFront.push(buildArmChain(armsFrontEl, m.shFrontR, poseR.shR, poseR.elR, poseR.wrR, gestureId, 1, false));
      cFront.push(buildLegChain(legsFrontEl, m.hipFrontL, legP.hipL, legP.kneeL, legP.ankleL, -1, "front"));
      cFront.push(buildLegChain(legsFrontEl, m.hipFrontR, legP.hipR, legP.kneeR, legP.ankleR, 1, "front"));

      lastDebugChains = (currentAngle === "front" || currentAngle === "back_180") ? cFront : c34;

      document.getElementById("btnArmL").textContent = `L Arm: ${poseL.label}`;
      document.getElementById("btnArmR").textContent = `R Arm: ${poseR.label}`;
      document.getElementById("btnHands").innerHTML = `Hands: ${handGestures[handGestureIndex].label} <kbd>A</kbd>`;
      document.getElementById("btnLegs").innerHTML = `Legs: ${legP.label} <kbd>L</kbd>`;

      const armsSummary = (poseL.id === poseR.id) ? poseL.label.toUpperCase() : `${poseL.label.toUpperCase()} / ${poseR.label.toUpperCase()}`;
      limbReadout.textContent = `ARMS: ${armsSummary} · LEGS: ${legP.label.toUpperCase()}`;

      updateJointDebugOverlay();
    }

    function cycleArmL() { armLIndex = (armLIndex + 1) % armPoses.length; renderConnectedLimbs(); }
    function cycleArmR() { armRIndex = (armRIndex + 1) % armPoses.length; renderConnectedLimbs(); }
    function cycleHandGesture() { handGestureIndex = (handGestureIndex + 1) % handGestures.length; renderConnectedLimbs(); }
    function cycleLegPose() { legPoseIndex = (legPoseIndex + 1) % legPoses.length; renderConnectedLimbs(); }

    function applyPresetPose(preset) {
      if (preset === "idol") {
        armLIndex = 2; armRIndex = 3; handGestureIndex = 0; legPoseIndex = 1; setExpression(4);
      } else if (preset === "tsundere") {
        armLIndex = 0; armRIndex = 0; handGestureIndex = 2; legPoseIndex = 0; setExpression(2);
      } else if (preset === "action") {
        armLIndex = 3; armRIndex = 2; handGestureIndex = 4; legPoseIndex = 2; setExpression(1);
      } else if (preset === "shy") {
        armLIndex = 4; armRIndex = 4; handGestureIndex = 1; legPoseIndex = 3; setExpression(5);
      }
      renderConnectedLimbs();
    }

    function renderTorsoAndLowerArchetype() {
      const m = getCharacterMetrics();
      const isMale = charGender === "male";
      const neckLayer = document.getElementById("neckLayer");
      const torsoFront = document.getElementById("torsoFront");
      const torso34 = document.getElementById("torso34");
      const lowerBaseFront = document.getElementById("lowerBaseFront");
      const lowerBase34 = document.getElementById("lowerBase34");
      const lowerGarmentFront = document.getElementById("lowerGarmentFront");
      const lowerGarment34 = document.getElementById("lowerGarment34");

      const neckW = isMale ? (charAge === "adult" ? 12 : 10) : 9;
      const shY = m.shFrontL.y;

    function buildAnimeEye(x, y, scaleX, scaleY, mode, sideSign) {
      const isMale = charGender === "male";
      const ageEyeFactor = charAge === "old" ? 0.78 : charAge === "adult" ? 0.88 : 1.0;

        return g;
      }

      const isFierce = mode === "fierce";
      const isWide = mode === "surprised";
      const ry = isWide ? 6.5 : isFierce ? 4.9 : 5.6;

      const irisGroup = createEl("g", { class: "eye-iris", "data-side": sideSign, "data-rx": "3.4", "data-ry": "1.6" });
      irisGroup.appendChild(createEl("ellipse", { cx: 0, cy: 0.2, rx: irisRx, ry: irisRy, fill: "url(#irisGrad)", stroke: "var(--eye-ring)", "stroke-width": "1.1" }));

        if (!isFront) {
          g.appendChild(createEl("ellipse", { cx: 226, cy: blushY + 1.5, rx: sp.heavyBlush ? 25 : 7, ry: sp.heavyBlush ? 4.2 : 2.8, fill: "var(--skin-blush)", opacity: isMale ? "0.14" : (sp.heavyBlush ? "0.48" : "0.28") }));
          g.appendChild(createEl("path", { d: poseMode === "34_up" ? `M 236 ${noseY + 1.5} L 238 ${noseY - 1.2} L 236 ${noseY - 2.2}` : `M 236 ${noseY - 1} L 237.5 ${noseY + 1.8} L 235.8 ${noseY + 2.6}`, fill: "none", stroke: "var(--ink)", "stroke-width": "1.35", "stroke-linecap": "round", "stroke-linejoin": "round" }));
        } else {
          g.appendChild(createEl("ellipse", { cx: 220, cy: blushY + 1.5, rx: sp.heavyBlush ? 28 : 8, ry: sp.heavyBlush ? 4.2 : 2.8, fill: "var(--skin-blush)", opacity: isMale ? "0.14" : (sp.heavyBlush ? "0.48" : "0.25") }));
          g.appendChild(createEl("path", { d: `M 220 ${noseY - 1} L 219.2 ${noseY + 1.8} L 220.6 ${noseY + 2.2}`, fill: "none", stroke: "var(--ink)", "stroke-width": "1.35", "stroke-linecap": "round", "stroke-linejoin": "round" }));
        }

        const mx = !isFront ? 231 : 220;
        const mScale = !isFront ? 0.92 : 1.0;
        const mg = createEl("g", { class: "anime-mouth", "data-x": mx, "data-y": mouthY, "data-sx": mScale, "data-sy": 1, transform: `translate(${mx}, ${mouthY}) scale(${mScale}, 1)` });

        if (sp.mouthType === "pout") {
          mg.appendChild(createEl("path", { d: "M -3.5 0.5 Q 0 -0.8 3.5 0.5", fill: "none", stroke: "var(--ink)", "stroke-width": "1.5", "stroke-linecap": "round" }));
          mg.appendChild(createEl("ellipse", { cx: 0, cy: 3.4, rx: 3.2, ry: 0.9, fill: "var(--skin-shade)", opacity: "0.7" }));
        } else if (sp.mouthType === "fang_grin") {
          mg.appendChild(createEl("path", { class: "ink", d: "M -12 -2.2 Q 0 -0.2 12 -2.2 C 11.5 5.2, 5.5 8.2, 0 8.2 C -5.5 8.2, -11.5 5.2, -12 -2.2 Z", fill: "#ffffff" }));
          if (!isOld) mg.appendChild(createEl("path", { d: "M 5.2 -1.6 L 6.8 1.4 L 8.4 -1.8 Z", fill: "#ffffff", stroke: "var(--ink)", "stroke-width": "0.9", "stroke-linejoin": "round" }));
          mg.appendChild(createEl("path", { d: "M -9.5 3.6 Q 0 1.8 9.5 3.6 C 7.5 7.2, -7.5 7.2, -9.5 3.6 Z", fill: "#fda4af", opacity: "0.55" }));
        } else if (sp.mouthType === "tsundere_frown") {
          mg.appendChild(createEl("path", { d: "M -7.5 2.4 Q 0 -2.4 7.5 2.4", fill: "none", stroke: "var(--ink)", "stroke-width": "1.7", "stroke-linecap": "round" }));
          mg.appendChild(createEl("ellipse", { cx: 0, cy: 4.5, rx: 3.6, ry: 0.9, fill: "var(--skin-shade)", opacity: "0.75" }));
        } else if (sp.mouthType === "wavy_shout") {
          mg.appendChild(createEl("path", { class: "ink", d: "M -9.5 3.5 C -9.5 -2.5, -3.5 -3.5, 0 -1.5 C 3.5 -3.5, 9.5 -2.5, 9.5 3.5 C 9.5 7.2, 4.5 5.5, 0 5.5 C -4.5 5.5, -9.5 7.2, -9.5 3.5 Z", fill: "#be123c" }));
          mg.appendChild(createEl("path", { d: "M -6.5 4.2 Q 0 2.2 6.5 4.2 C 4.5 6.0, -4.5 6.0, -6.5 4.2 Z", fill: "#fda4af" }));
        } else if (sp.mouthType === "shy_o") {
          mg.appendChild(createEl("ellipse", { class: "ink", cx: 0, cy: 1.5, rx: 3.2, ry: 3.6, fill: "#be123c" }));
          mg.appendChild(createEl("ellipse", { cx: 0, cy: 3.0, rx: 2.0, ry: 1.4, fill: "#fda4af" }));
        }

        if (isMale && isOld) {
          mg.appendChild(createEl("path", { d: "M -13 -1.2 C -9 -5.5, -2 -4.8, 0 -2.4 C 2 -4.8, 9 -5.5, 13 -1.2 C 9 -0.5, 3 -1.2, 0 -0.6 C -3 -1.2, -9 -0.5, -13 -1.2 Z", fill: "#f1f5f9", stroke: "#64748b", "stroke-width": "0.9" }));
          mg.appendChild(createEl("path", { d: "M -5 8.5 L 0 15.5 L 5 8.5 Z", fill: "#f1f5f9", stroke: "#64748b", "stroke-width": "0.9" }));
        }

        g.appendChild(mg);
        container.appendChild(g);
      });
    }

    function rebuildCharacterArchetype() {
      const genderLabel = charGender === "female" ? "♀ FEMALE" : "♂ MALE";
      const ageLabel = charAge.toUpperCase();
      charReadout.textContent = `${genderLabel} · ${ageLabel}`;

      document.querySelectorAll(".gender-btn").forEach(btn => btn.classList.toggle("active-rose", btn.dataset.gender === charGender));
      document.querySelectorAll(".age-btn").forEach(btn => btn.classList.toggle("active-teal", btn.dataset.age === charAge));

      const labels = getHairLabels();
      document.getElementById("btnHairStyle").innerHTML = `Hair: ${labels[hairIndex]} <kbd>H</kbd>`;

      renderTorsoAndLowerArchetype();
      renderHeadsAndHairArchetype();
      renderPaperBackView();

      document.querySelectorAll(".proj-svg").forEach(svg => cacheOrigGeometry(svg));
      applyPerspectiveWarp(currentPersp);
    }

    function setGender(g) {
      charGender = g;
      setPalette(paletteIndex);
      rebuildCharacterArchetype();
    }

    function setAge(a) {
      charAge = a;
      setPalette(paletteIndex);
      rebuildCharacterArchetype();
    }

    const projSvgs = document.querySelectorAll(".proj-svg");

    function applyPerspectiveWarp(p) {
      currentPersp = Number(p);
      perspSlider.value = currentPersp.toFixed(2);
      perspValue.textContent = currentPersp.toFixed(2);

      projSvgs.forEach(svg => {
        svg.querySelectorAll("path").forEach(el => {
          if (el.closest("#fkFarArm34, #fkArmsFront, #fkArms34, #fkLegsFront, #fkLegs34")) return;
          if (el.dataset.origD) el.setAttribute("d", warpSvgPathD(el.dataset.origD, currentPersp));
        });
        svg.querySelectorAll("circle").forEach(el => {
          if (el.closest("#fkFarArm34, #fkArmsFront, #fkArms34, #fkLegsFront, #fkLegs34")) return;
          if (!el.dataset.origCx) return;
          const cx = Number(el.dataset.origCx), cy = Number(el.dataset.origCy), r = Number(el.dataset.origR);
          const [nx, ny] = projectPoint(cx, cy, currentPersp);
          const s = getScaleAtY(cy, currentPersp);
          el.setAttribute("cx", nx.toFixed(1)); el.setAttribute("cy", ny.toFixed(1)); el.setAttribute("r", (r * s).toFixed(2));
        });
        svg.querySelectorAll("ellipse").forEach(el => {
          if (!el.dataset.origCx) return;
          const cx = Number(el.dataset.origCx), cy = Number(el.dataset.origCy), rx = Number(el.dataset.origRx), ry = Number(el.dataset.origRy);
          const [nx, ny] = projectPoint(cx, cy, currentPersp);
          const s = getScaleAtY(cy, currentPersp);
          el.setAttribute("cx", nx.toFixed(1)); el.setAttribute("cy", ny.toFixed(1)); el.setAttribute("rx", (rx * s).toFixed(2)); el.setAttribute("ry", (ry * s).toFixed(2));
        });
        svg.querySelectorAll("rect").forEach(el => {
          if (!el.dataset.origX) return;
          const x = Number(el.dataset.origX), y = Number(el.dataset.origY), w = Number(el.dataset.origW), h = Number(el.dataset.origH);
          const [nx, ny] = projectPoint(x + w / 2, y + h / 2, currentPersp);
          const s = getScaleAtY(y, currentPersp);
          el.setAttribute("x", (nx - (w * s) / 2).toFixed(1)); el.setAttribute("y", (ny - (h * s) / 2).toFixed(1));
          el.setAttribute("width", (w * s).toFixed(2)); el.setAttribute("height", (h * s).toFixed(2));
        });
      });

      document.querySelectorAll(".anime-eye, .anime-mouth").forEach(el => {
        const ox = Number(el.dataset.x), oy = Number(el.dataset.y), osx = Number(el.dataset.sx), osy = Number(el.dataset.sy);
        const [px, py] = projectPoint(ox, oy, currentPersp);
        const s = getScaleAtY(oy, currentPersp);
        el.setAttribute("transform", `translate(${px.toFixed(2)}, ${py.toFixed(2)}) scale(${(osx * s).toFixed(3)}, ${(osy * s).toFixed(3)})`);
      });

      renderConnectedLimbs();
    }

    function onPerspSlider(val) { applyPerspectiveWarp(Number(val)); }

    let showJointDebug = false;
    function toggleJointDebug() {
      showJointDebug = !showJointDebug;
      document.body.classList.toggle("show-joints", showJointDebug);
      const btn = document.getElementById("btnJointDebug");
      btn.classList.toggle("active-cyan", showJointDebug);
      btn.innerHTML = `Joint Lock Debug: ${showJointDebug ? "ON" : "OFF"} <kbd>X</kbd>`;
      updateJointDebugOverlay();
    }

    function updateJointDebugOverlay() {
      if (!showJointDebug) return;
      const debugLayer = document.getElementById("jointDebugLayer");
      debugLayer.innerHTML = "";
      const isFront = currentAngle === "front" || currentAngle === "back_180";
      const mirrorLeft = currentAngle.startsWith("34_l");

      lastDebugChains.forEach(chain => {
        const projPts = chain.map(pt => {
          const [px, py] = projectPoint(pt.x, pt.y, currentPersp);
          return {
            x: (!isFront && mirrorLeft) ? 440 - px : px,
            y: py
          };
        });

        for (let i = 0; i < projPts.length - 1; i++) {
          debugLayer.appendChild(createEl("line", {
            x1: projPts[i].x.toFixed(1), y1: projPts[i].y.toFixed(1),
            x2: projPts[i + 1].x.toFixed(1), y2: projPts[i + 1].y.toFixed(1),
            stroke: "#22d3ee", "stroke-width": "1.5", "stroke-dasharray": "3 2"
          }));
        }

        projPts.forEach((p, idx) => {
          const col = idx === 0 ? "#c084fc" : idx === 1 ? "#22d3ee" : "#fb7185";
          debugLayer.appendChild(createEl("circle", {
            cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: "4.2",
            fill: "rgba(16,14,24,0.8)", stroke: col, "stroke-width": "1.5"
          }));
        });
      });
    }

    let showCage = false;
    function togglePerspectiveCage() {
      showCage = !showCage;
      document.body.classList.toggle("show-cage", showCage);
      const btn = document.getElementById("btnCage");
      btn.classList.toggle("active-blue", showCage);
      btn.innerHTML = `Perspective Cage: ${showCage ? "ON" : "OFF"} <kbd>G</kbd>`;
    }

    let isPixelMode = false;
    const pixelBlocks = [2, 3, 4, 6];
    let pixelBlockIdx = 1;
    function togglePixelMode() {
      isPixelMode = !isPixelMode;
      document.body.classList.toggle("pixel-mode", isPixelMode);
      const btn = document.getElementById("btnPixelMode");
      btn.classList.toggle("active-blue", isPixelMode);
      btn.innerHTML = `Pixel Rasterizer: ${isPixelMode ? "ON" : "OFF"} <kbd>P</kbd>`;
    }

    function cyclePixelBlock() {
      pixelBlockIdx = (pixelBlockIdx + 1) % pixelBlocks.length;
      const sz = pixelBlocks[pixelBlockIdx];
      document.getElementById("pixelComp").setAttribute("width", sz);
      document.getElementById("pixelComp").setAttribute("height", sz);
      document.getElementById("pixelMorph").setAttribute("radius", (sz * 0.38).toFixed(2));
      document.getElementById("btnPixelBlock").textContent = `Block: ${sz}px`;
    }

    const expressions = ["1. POUT", "2. GRIN", "3. SERIOUS", "4. SHOUT", "5. WINK", "6. SHY GLANCE"];
    const angleConfigs = {
      "34_l_up":   { label: "3/4 LEFT — UP ↖",   yaw: 16,  pitch: 7,   gazeY: -0.75, persp: 0.44, zoom: 0.72 },
      "34_l":      { label: "3/4 VIEW (LEFT)",   yaw: 16,  pitch: -2,  gazeY: 0.05,  persp: 0.0,  zoom: 0.78 },
      "34_l_down": { label: "3/4 LEFT — DOWN ↙", yaw: 18,  pitch: -10, gazeY: 0.72,  persp: -0.52,zoom: 0.78 },
      "front":     { label: "FRONT VIEW (0°)",   yaw: 0,   pitch: -2,  gazeY: 0.05,  persp: 0.0,  zoom: 0.78 },
      "34_r_up":   { label: "3/4 RIGHT — UP ↗",  yaw: -16, pitch: 7,   gazeY: -0.75, persp: 0.44, zoom: 0.72 },
      "34_r":      { label: "3/4 VIEW (RIGHT)",  yaw: -16, pitch: -2,  gazeY: 0.05,  persp: 0.0,  zoom: 0.78 },
      "34_r_down": { label: "3/4 RIGHT — DOWN ↘",yaw: -18, pitch: -10, gazeY: 0.72,  persp: -0.52,zoom: 0.78 },
      "back_180":  { label: "BACK VIEW (180°)",  yaw: 180, pitch: -2,  gazeY: 0.05,  persp: 0.0,  zoom: 0.78 }
    };

    function getHairLabels() {
      return charGender === "female"
        ? ["Twin Braids", "Twin Buns", "Long Flowing", "Side Ponytail"]
        : ["Layered Crop", "Spiky Tousled", "Neat Side Part", "Short Wolf Cut"];
    }

    let isPaper = false, exprIndex = 0, currentAngle = "34_r", hairIndex = 0;
    let gazeX = 0.85, targetGazeX = 0.85, gazeY = 0.05, targetGazeY = 0.05, followMouse = false;
    let currentDepth = 1, targetDepth = 1, camYaw = -16, targetYaw = -16, camPitch = -2, targetPitch = -2, camZoom = 0.78, targetZoom = 0.78, camPanY = 0, targetPanY = 0;

    function selectAngle(angleKey) {
      currentAngle = angleKey;
      const cfg = angleConfigs[angleKey];
      const isFront = angleKey === "front" || angleKey === "back_180";
      const mirrorLeft = angleKey.startsWith("34_l");
      const isUp = angleKey.endsWith("_up");
      const isDown = angleKey.endsWith("_down");
      const mirrorAttr = mirrorLeft ? "translate(440, 0) scale(-1, 1)" : "";

      ["backHairFront", "bodyLowerFront", "torsoFront", "armsFront", "headFront", "frontHairFront"].forEach(id => {
        document.getElementById(id).style.display = isFront ? "inline" : "none";
      });
      ["backHair34", "bodyLower34", "armsFar34", "torso34", "arms34", "frontHair34"].forEach(id => {
        const el = document.getElementById(id);
        el.style.display = isFront ? "none" : "inline";
        el.setAttribute("transform", mirrorAttr);
      });

      const headMid = document.getElementById("head34Mid");
      const headUp = document.getElementById("head34Up");
      const headDown = document.getElementById("head34Down");
      headMid.style.display = (!isFront && !isUp && !isDown) ? "inline" : "none";
      headUp.style.display = (!isFront && isUp) ? "inline" : "none";
      headDown.style.display = (!isFront && isDown) ? "inline" : "none";
      headMid.setAttribute("transform", mirrorAttr);
      headUp.setAttribute("transform", mirrorAttr);
      headDown.setAttribute("transform", mirrorAttr);

      applyPerspectiveWarp(cfg.persp);
      targetYaw = cfg.yaw;
      targetPitch = cfg.pitch;
      if (cfg.zoom) { targetZoom = cfg.zoom; targetPanY = 0; }
      if (!followMouse) targetGazeY = cfg.gazeY;

      document.querySelectorAll(".angle-btn").forEach(btn => btn.classList.toggle("active-amber", btn.dataset.angle === angleKey));
      angleReadout.textContent = cfg.label;
      updateJointDebugOverlay();
    }

    function setGazePreset(preset) {
      followMouse = false;
      document.getElementById("btnFollowMouse").classList.remove("active-emerald");
      document.getElementById("btnFollowMouse").textContent = "Cursor: OFF";
      if (preset === "left") { targetGazeX = -0.85; targetGazeY = 0.05; gazeReadout.textContent = "GAZE: LEFT ◀"; }
      else if (preset === "center") { targetGazeX = 0.0; targetGazeY = 0.0; gazeReadout.textContent = "GAZE: CENTER ●"; }
      else if (preset === "right") { targetGazeX = 0.85; targetGazeY = 0.05; gazeReadout.textContent = "GAZE: RIGHT ▶"; }
      else if (preset === "up") { targetGazeX = 0.0; targetGazeY = -0.85; gazeReadout.textContent = "GAZE: UP ▲"; }
      document.querySelectorAll(".gaze-btn").forEach(btn => btn.classList.toggle("active-emerald", btn.dataset.gaze === preset));
    }

    function toggleFollowMouse() {
      followMouse = !followMouse;
      const btn = document.getElementById("btnFollowMouse");
      btn.classList.toggle("active-emerald", followMouse);
      btn.textContent = followMouse ? "Cursor: ON" : "Cursor: OFF";
      if (followMouse) {
        document.querySelectorAll(".gaze-btn").forEach(b => b.classList.remove("active-emerald"));
        gazeReadout.textContent = "GAZE: CURSOR";
      } else {
        setGazePreset("right");
      }
    }

    function setExpression(idx) {
      exprIndex = idx;
      document.querySelectorAll(".expr-layer").forEach(el => { el.style.display = el.classList.contains(`expr-${idx}`) ? "inline" : "none"; });
      document.querySelectorAll(".expr-btn").forEach((btn, i) => btn.classList.toggle("active-blue", i === idx));
      exprReadout.textContent = expressions[idx];
    }

    function toggleHairStyle() {
      hairIndex = (hairIndex + 1) % 4;
      for (let i = 0; i < 4; i++) {
        document.querySelectorAll(`.hair-variant-${i}`).forEach(el => { el.style.display = i === hairIndex ? "inline" : "none"; });
      }
      const labels = getHairLabels();
      document.getElementById("btnHairStyle").innerHTML = `Hair: ${labels[hairIndex]} <kbd>H</kbd>`;
    }

    function toggleFootwear() {
      showShoes = !showShoes;
      document.getElementById("btnFootwear").innerHTML = `Feet: ${showShoes ? "Loafers" : "Barefoot"} <kbd>F</kbd>`;
      renderConnectedLimbs();
    }

    function toggleStringify() {
      isPaper = !isPaper;
      targetDepth = isPaper ? 0 : 1;
      btnStringify.classList.toggle("active", isPaper);
      statusDot.classList.toggle("paper", isPaper);
      stateLabel.classList.toggle("paper", isPaper);
      stateLabel.textContent = isPaper ? "2D PAPER CUTOUT" : "3D MATERIALIZED";
      stringWave.classList.remove("flash");
      void stringWave.offsetWidth;
      stringWave.classList.add("flash");
    }

    function setCamera(yaw, pitch, zoom, panY = 0) {
      targetYaw = yaw; targetPitch = pitch; targetZoom = zoom; targetPanY = panY;
    }

    const viewport = document.getElementById("viewport");
    let dragging = false, lastX = 0, lastY = 0;

    viewport.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener("pointermove", (e) => {
      if (followMouse) {
        targetGazeX = Math.max(-1, Math.min(1, ((e.clientX / window.innerWidth) - 0.5) * 2.2));
        targetGazeY = Math.max(-1, Math.min(1, ((e.clientY / window.innerHeight) - 0.35) * 2.2));
      }
      if (!dragging) return;
      targetYaw += (e.clientX - lastX) * 0.45;
      targetPitch = Math.max(-60, Math.min(45, targetPitch - (e.clientY - lastY) * 0.35));
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      targetZoom = Math.max(0.55, Math.min(2.4, targetZoom - e.deltaY * 0.0008));
      targetPanY = Math.max(0, Math.min(260, (targetZoom - 0.78) * 230));
    }, { passive: false });

    const ageCycleOrder = ["teenager", "adult", "old"];
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); toggleStringify(); }
      else if (e.key >= "1" && e.key <= "6") setExpression(Number(e.key) - 1);
      else if (e.key.toLowerCase() === "m") setGender(charGender === "female" ? "male" : "female");
      else if (e.key.toLowerCase() === "n") setAge(ageCycleOrder[(ageCycleOrder.indexOf(charAge) + 1) % ageCycleOrder.length]);
      else if (e.key.toLowerCase() === "a") cycleHandGesture();
      else if (e.key.toLowerCase() === "l") cycleLegPose();
      else if (e.key.toLowerCase() === "g") togglePerspectiveCage();
      else if (e.key.toLowerCase() === "x") toggleJointDebug();
      else if (e.key.toLowerCase() === "h") toggleHairStyle();
      else if (e.key.toLowerCase() === "f") toggleFootwear();
      else if (e.key.toLowerCase() === "p") togglePixelMode();
      else if (e.key.toLowerCase() === "c") setPalette((paletteIndex + 1) % palettes.length);
      else if (e.key === "ArrowLeft") setGazePreset("left");
      else if (e.key === "ArrowRight") setGazePreset("right");
      else if (e.key === "ArrowUp") setGazePreset("up");
      else if (e.key === "ArrowDown") setGazePreset("center");
      else if (e.key.toLowerCase() === "r") setCamera(camYaw, camPitch, 0.78, 0);
    });

    rebuildCharacterArchetype();
    selectAngle("34_r");
    setGazePreset("right");

    let clock = 0;
    function animate() {
      clock += 0.04;
      currentDepth += (targetDepth - currentDepth) * 0.18;
      const normalizedYaw = Math.abs(((camYaw % 360) + 540) % 360 - 180);
      const isBackFacing = normalizedYaw > 92;
      const paperAlpha = isBackFacing ? 1 : Math.max(0, Math.min(1, 1 - currentDepth * 1.45));
      root.style.setProperty("--depth", currentDepth.toFixed(4));
      root.style.setProperty("--paper-opacity", paperAlpha.toFixed(3));

      camYaw += (targetYaw - camYaw) * 0.14;
      camPitch += (targetPitch - camPitch) * 0.14;
      camZoom += (targetZoom - camZoom) * 0.14;
      camPanY += (targetPanY - camPanY) * 0.14;

      gazeX += (targetGazeX - gazeX) * 0.2;
      gazeY += (targetGazeY - gazeY) * 0.2;

      const mirrorFlip = currentAngle.startsWith("34_l") ? -1 : 1;
      const worldGazeX = gazeX * mirrorFlip;

      document.querySelectorAll(".eye-iris").forEach(iris => {
        const side = Number(iris.dataset.side || 1);
        const rx = Number(iris.dataset.rx || 3.4);
        const ry = Number(iris.dataset.ry || 1.6);
        iris.setAttribute("transform", `translate(${(worldGazeX * rx * side).toFixed(2)}, ${(gazeY * ry).toFixed(2)})`);
      });

      cameraRig.style.transform = `translateY(${camPanY}px) scale3d(${camZoom}, ${camZoom}, ${camZoom}) rotateX(${camPitch}deg) rotateY(${camYaw}deg)`;
      characterRig.style.transform = `translateY(${Math.sin(clock) * 2.0}px)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
